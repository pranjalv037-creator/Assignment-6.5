<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Mini-Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><main class="profile-container">
    <article class="profile-card">

        <span class="profile-badge">Available</span>

        <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop"
            alt="Profile portrait"
            class="profile-image"
        >

        <h1 class="profile-name">Pranjal Verma</h1>
        <h2 class="profile-role">Aspiring Web Developer</h2>

        <p class="profile-description">
            I am a student interested in web development and
            technology. I enjoy learning HTML, CSS, and JavaScript
            and creating user-friendly websites.
        </p>

        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">JavaScript</span>
        </div>

        <a class="contact-button" href="mailto:">
            Contact Me
        </a>

    </article>
</main>

</body>
</html>
